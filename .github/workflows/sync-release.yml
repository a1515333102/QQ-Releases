name: Sync QQ Releases

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-qq-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/sync.py --publish

      - name: Persist seed config
        if: success()
        run: |
          if [ ! -f scripts/seed-pcConfig.json ]; then
            echo "no seed file"
            exit 0
          fi
          if git diff --quiet -- scripts/seed-pcConfig.json; then
            echo "seed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seed-pcConfig.json
          git commit -m "chore: refresh seed-pcConfig.json"
          git push
